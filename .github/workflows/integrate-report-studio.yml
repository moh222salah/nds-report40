name: Integrate NDS Report Studio

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/integrate-report-studio.cjs"
      - ".github/workflows/integrate-report-studio.yml"

permissions:
  contents: write

concurrency:
  group: nds-report-studio-integration
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate integration scripts
        run: |
          node --check .github/scripts/integrate-report-studio.cjs
          node --check report-studio-enhance.js

      - name: Apply Report Studio page and navigation
        run: node .github/scripts/integrate-report-studio.cjs

      - name: Verify patch and whitespace
        run: |
          git diff --check
          grep -q 'id="s13"' index.html
          grep -q 'href="#s13"' index.html
          grep -q 'id="s11"' full-report.html
          grep -q 'href="#s11"' full-report.html
          grep -q 'report-studio-enhance.js' index.html
          echo "REPORT_STUDIO_SOURCE_CHECK=PASS"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No new changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html full-report.html
          git commit -m "feat(report): add NDS Report Studio page before engineering log"
          git push origin HEAD:main
